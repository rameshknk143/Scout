name: ScoutVeda Max Capacity Collector

# Triggered manually or on schedule (multiple times per day for max coverage)
on:
  schedule:
    # Run 4x per day for maximum coverage
    - cron: '0 1,9,17,23 * * *'  # 06:30, 14:30, 22:30, 04:30 IST
  workflow_dispatch:
    inputs:
      session:
        description: 'Run type'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - top-level
          - subcategories
          - watchlist
      workers:
        description: 'Concurrency workers (default: 12)'
        type: string
        default: '12'
      subcat-max:
        description: 'Max sub-categories (default: 382)'
        type: string
        default: '382'

jobs:
  collect-top-level:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.session == 'full' || github.event.inputs.session == 'top-level' || (github.event.schedule && contains('0 1,9,17,23 * * *', github.event.schedule)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run top-level collection (max capacity)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCOUT_FETCH_WORKERS: '12'
          SCOUT_GAP_MIN: '8'
          SCOUT_GAP_MAX: '18'
          SCOUT_PAGES: '1,2'
          SCOUT_LIST_TYPES: 'bestsellers,new-releases,most-wished-for,most-gifted'
          SCOUT_MAX_RETRIES: '3'
          SCOUT_REQUEST_TIMEOUT: '30'
          SCOUT_PROXY: ${{ secrets.SCOUT_PROXY }}  # residential proxy (optional; unblocks bot-walled datacenter IPs)
        run: python collector_optimized.py

  collect-subcategories:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.session == 'full' || github.event_name == 'workflow_dispatch' && github.event.inputs.session == 'subcategories' || (github.event.schedule && contains('0 1,9,17,23 * * *', github.event.schedule)) }}
    runs-on: ubuntu-latest
    needs: collect-top-level
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run subcategory collection (max capacity)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCOUT_SUBCAT_MAX: ${{ github.event.inputs.subcat-max || '382' }}
          SCOUT_SUBCAT_LIST_TYPES: 'bestsellers,new-releases'
          SCOUT_SUBCAT_PAGES: '1,2'
          SCOUT_FETCH_WORKERS: '12'
          SCOUT_GAP_MIN: '8'
          SCOUT_GAP_MAX: '18'
          SCOUT_PROXY: ${{ secrets.SCOUT_PROXY }}  # residential proxy (optional)
        run: python collector_optimized.py --subcats

  collect-watchlist:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.session == 'watchlist' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run watchlist deep scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCOUT_PROXY: ${{ secrets.SCOUT_PROXY }}  # residential proxy (optional)
        run: python watchlist_scrape.py

  health-check:
    if: always()
    runs-on: ubuntu-latest
    needs: [collect-top-level, collect-subcategories]
    steps:
      - name: Collection summary
        run: |
          echo "## ScoutVeda Collection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Top-level collection: ${{ needs.collect-top-level.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Subcategory collection: ${{ needs.collect-subcategories.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next run:** 6 hours (4x daily for max coverage)" >> $GITHUB_STEP_SUMMARY
