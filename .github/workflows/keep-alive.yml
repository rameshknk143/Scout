name: Scout Keep-Alive

# Render's free plan puts a service to sleep after ~15 minutes with no inbound
# requests, so the next visitor pays a 30-60s cold start (this is what made
# login feel broken). Pinging the public /health endpoint every 10 minutes keeps
# the service warm. /health is the one route with no require_key dependency and
# it touches no database, so this is safe to run from a public runner.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping scout-api health endpoint
        run: |
          curl -sS "https://scout-api-3yvy.onrender.com/health" \
            --max-time 120 --retry 3 --retry-delay 15 --retry-all-errors \
            -w "\nHTTP %{http_code}\n"
