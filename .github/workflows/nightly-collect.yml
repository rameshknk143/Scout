name: Scout Nightly Collector

# Two nightly sessions, deliberately far apart (8-hour gap):
#   session 1 (collect)   : the 31 top-level categories, all 4 list types
#   session 2 (subcats)   : Amazon's per-browse-node lists, from subcats.json
# Each starts on a FRESH GitHub runner (fresh IP + TLS + no cookies), so a
# back-to-back burst is what gets flagged, not the gap. The 8-hour gap is
# cheap insurance against the shared runner pool inheriting heat from a
# concurrent run; lowering it to 30 min is safe (each run is already a new
# "user" to Amazon) but buys almost nothing at the current volume.
#
# Budget (public repo, unlimited Actions-min/month):
#   session 1 ~34 min + session 2 ~55 min = ~90 min/night = ~2,700 min/mo.
# Unlimited now. BROAD layer runs full 382 sub-cats × 2 pages × 2 list types
# = ~12,000–16,000 rows/night. To grow further, add most-gifted/most-wished-for
# to SCOUT_SUBCAT_LIST_TYPES once their liveness probe shows them revived.

on:
  schedule:
    # 20:15 UTC = 01:45 IST — session 1
    - cron: "15 20 * * *"
    # 04:15 UTC = 09:45 IST — session 2 (8-hour gap)
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      session:
        description: "Which session to run: top-level categories, or sub-categories"
        type: choice
        options:
          - top
          - subcats
        default: top

jobs:
  collect:
    if: ${{ github.event.schedule == '15 20 * * *' || github.event_name == 'workflow_dispatch' && github.event.inputs.session != 'subcats' }}
    runs-on: ubuntu-latest
    # ~40 min expected; 75 leaves room for a slow night without a runaway.
    timeout-minutes: 75
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run top-level collection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Throughput knobs — see the comments in collector.py (module header)
          # for the full reasoning; each is env-overridable so a bad night is a
          # one-line rollback, not a redeploy.
          SCOUT_PAGES: "1,2"
          SCOUT_FETCH_WORKERS: "4"
          SCOUT_GAP_MIN: "20"
          SCOUT_GAP_MAX: "45"
        run: python collector.py

  subcats:
    if: ${{ github.event.schedule == '15 4 * * *' || github.event_name == 'workflow_dispatch' && github.event.inputs.session == 'subcats' }}
    runs-on: ubuntu-latest
    # ~30 min expected at the session-2 budget below; 45 leaves room to grow.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sub-category collection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Sub-category knobs (all read by collector.py):
          # SCOUT_SUBCAT_MAX=382        how many browse-node lists this session
          #                              touches. Now unlimited (public repo).
          # SCOUT_SUBCAT_LIST_TYPES    default "bestsellers,new-releases" — the
          #                              two that render reliably. Add the other
          #                              two once their nightly liveness probe
          #                              shows them serving full lists.
          # SCOUT_SUBCAT_PAGES         "1,2" — both pages now that minutes are
          #                              unlimited. Each sub-cat list has two
          #                              server-rendered pages (ranks 1-30, 51-80).
          SCOUT_SUBCAT_MAX: "382"
          SCOUT_SUBCAT_LIST_TYPES: "bestsellers,new-releases"
          SCOUT_SUBCAT_PAGES: "1,2"
          SCOUT_FETCH_WORKERS: "4"
          SCOUT_GAP_MIN: "15"
          SCOUT_GAP_MAX: "30"
        run: python collector.py --subcats

