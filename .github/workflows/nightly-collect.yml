name: Scout Nightly Collector

on:
  schedule:
    # 20:45 UTC = 02:15 IST — same time the old Windows Task Scheduler job used
    - cron: "45 20 * * *"
  workflow_dispatch: {}  # lets us trigger it manually from the GitHub UI to test

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run nightly collection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python collector.py
