name: Scout Monitor

# Hourly end-to-end check of the API and web app. scripts/monitor.py exits
# non-zero when something is wrong, which fails this workflow, which makes
# GitHub send Ram its standard "run failed" email. No paid alerting service,
# no new account, no extra secret beyond the API key -- the notification
# channel is one GitHub already owns.
#
# WHY A SCHEDULE HERE WHEN keep-alive.yml HAD ITS SCHEDULE REMOVED
# ----------------------------------------------------------------
# keep-alive.yml's schedule was removed because GitHub's cron is best-effort
# and routinely stretches a 10-minute interval past Render's 15-minute sleep
# timer -- for a keep-warm ping, late means it did not work at all. A monitor
# does not care: a check that lands at 07:40 instead of 07:00 is still a valid
# check. Same unreliable scheduler, different tolerance.
#
# WHY THE HOURS ARE WINDOWED (03:00-18:00 UTC, 08:30-23:30 IST)
# -------------------------------------------------------------
# Render's free tier allows 750 instance hours/month and the service sleeps
# after ~15 idle minutes. The Oracle VM's keep-warm cron (*/10 2-19 UTC)
# already holds it awake across this whole window, so these requests land on
# an instance that is running anyway and add ZERO instance hours. A check
# outside the window would wake a sleeping service and burn hours that the
# 750 cap cannot spare. The window ends at 18:00 rather than 19:00 so that
# scheduler drift cannot push a run past the 19:59 edge of keep-warm.
#
# FOUR RUNS A DAY, NOT SIXTEEN. This used to run hourly, on the assumption that
# 16 runs of ~10s each cost ~90 minutes a month. That arithmetic was wrong in a
# way worth recording: GitHub bills each *job* rounded up to a whole minute, so
# a 10-second run costs a full minute and the true price was 16 x 30 = 480
# minutes a month. This repo is private, so the 2,000-minute allowance is real,
# and it was already 77% consumed -- exhausting it stops workflows outright,
# which would silently kill the nightly collector.
#
# Hourly polling from here is also no longer what it was for. The VM now runs
# its own watchdog every 15 minutes and mails its own failures, so continuous
# liveness is covered from inside, for free, at four times the resolution. What
# only an outside observer can do is notice that the VM has gone silent
# altogether, and that check does not need to run hourly to be useful.
#
# 03/08/13/18 UTC keeps every run inside the keep-warm window and puts at most
# a 9-hour gap between checks. 120 billed minutes a month, down from 480.

on:
  schedule:
    - cron: "0 3,8,13,18 * * *"
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the step below can find the last commit that touched
          # api/. The default depth of 1 would make every run think the current
          # commit is the API commit.
          fetch-depth: 0

      - name: Work out which commit Render should be serving
        # NOT github.sha. render.yaml sets `rootDir: api`, so Render only builds
        # when something under api/ changes -- a commit to scripts/ or to this
        # workflow deliberately does not deploy. Comparing the running service
        # against HEAD therefore prints "main is <newer sha>" whenever the last
        # push was monitoring-only, which looks like a stuck deploy and is not
        # one. That exact line cost an evening of chasing on 13 Aug.
        id: api_commit
        run: echo "sha=$(git log -1 --format=%H -- api/)" >> "$GITHUB_OUTPUT"

      - name: Check the API key secret is present
        # Without this, a missing secret looks identical to a broken API: four
        # authenticated checks fail with 401 every hour and the real cause is
        # not in the log anywhere.
        #
        # API_KEY, not a new SCOUT_KEY. This workflow originally asked for a
        # secret of its own and failed its guard step on all 8 scheduled runs of
        # 13 Aug, waiting on someone to add one -- when the repository already
        # had the same value under the name nightly-storefront-sync.yml sends as
        # X-Scout-Key. A monitor nobody can run is worth nothing, and a second
        # copy of one key is a second thing to rotate.
        run: |
          if [ -z "${{ secrets.API_KEY }}" ]; then
            echo "::error::Repository secret API_KEY is not set."
            echo "Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "Value is API_KEY from the API's environment (Render dashboard)."
            exit 1
          fi

      - name: Run checks
        env:
          SCOUT_KEY: ${{ secrets.API_KEY }}
          EXPECTED_COMMIT: ${{ steps.api_commit.outputs.sha }}
        run: python3 scripts/monitor.py
